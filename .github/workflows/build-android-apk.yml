name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vendor SheetJS CE 0.20.3
        run: |
          mkdir -p vendor
          curl --fail --location --retry 3 \
            --output vendor/xlsx.mini.min.js \
            https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.mini.min.js
          echo "0cb353f830d7288385492c83d277b058ddeac664ca51cf1393aa1fd3e2b70939  vendor/xlsx.mini.min.js" | sha256sum --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/xlsx.mini.min.js
          if ! git diff --cached --quiet; then
            git commit -m "Vendor SheetJS CE 0.20.3"
            git push
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore fixed signing key
        env:
          STRETCH_KEYSTORE_BASE64: ${{ secrets.STRETCH_KEYSTORE_BASE64 }}
        run: |
          test -n "$STRETCH_KEYSTORE_BASE64"
          echo "$STRETCH_KEYSTORE_BASE64" | base64 --decode > android/app/stretch-timer.jks

      - name: Build fixed-signed release APK
        env:
          STRETCH_KEYSTORE_PATH: stretch-timer.jks
          STRETCH_KEYSTORE_PASSWORD: ${{ secrets.STRETCH_KEYSTORE_PASSWORD }}
          STRETCH_KEY_ALIAS: ${{ secrets.STRETCH_KEY_ALIAS }}
          STRETCH_KEY_PASSWORD: ${{ secrets.STRETCH_KEY_PASSWORD }}
        run: |
          test -n "$STRETCH_KEYSTORE_PASSWORD"
          test -n "$STRETCH_KEY_ALIAS"
          test -n "$STRETCH_KEY_PASSWORD"
          gradle -p android :app:assembleRelease

      - name: Verify release APK and update signature
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          AAPT="$BUILD_TOOLS/aapt"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          NEW_APK=$(find android/app/build/outputs/apk/release -name 'app-release-v*.apk' -type f | head -n 1)
          test -n "$NEW_APK"
          test -f dist/stretch-timer-v0.12.15.apk
          "$APKSIGNER" verify --verbose "$NEW_APK"
          if "$AAPT" dump badging "$NEW_APK" | grep -q 'application-debuggable'; then
            echo "Release APK is unexpectedly debuggable"
            exit 1
          fi
          OLD_CERT=$("$APKSIGNER" verify --print-certs dist/stretch-timer-v0.12.15.apk | awk -F': ' '/Signer #1 certificate SHA-256 digest/{print $2; exit}')
          NEW_CERT=$("$APKSIGNER" verify --print-certs "$NEW_APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest/{print $2; exit}')
          test -n "$OLD_CERT"
          test "$NEW_CERT" = "$OLD_CERT"
          echo "Release APK is non-debuggable and uses the existing update certificate"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stretch-timer-release-apk
          path: android/app/build/outputs/apk/release/app-release-v*.apk
          if-no-files-found: error

      - name: Publish APK to repository
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release-v*.apk dist/stretch-timer-v0.12.16.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/stretch-timer-v0.12.16.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish Stretch Timer APK v0.12.16"
            git push
          fi
