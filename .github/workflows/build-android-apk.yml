name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore fixed signing key
        env:
          STRETCH_KEYSTORE_BASE64: ${{ secrets.STRETCH_KEYSTORE_BASE64 }}
        run: |
          test -n "$STRETCH_KEYSTORE_BASE64"
          echo "$STRETCH_KEYSTORE_BASE64" | base64 --decode > android/app/stretch-timer.jks

      - name: Build fixed-signed debug APK
        env:
          STRETCH_KEYSTORE_PATH: stretch-timer.jks
          STRETCH_KEYSTORE_PASSWORD: ${{ secrets.STRETCH_KEYSTORE_PASSWORD }}
          STRETCH_KEY_ALIAS: ${{ secrets.STRETCH_KEY_ALIAS }}
          STRETCH_KEY_PASSWORD: ${{ secrets.STRETCH_KEY_PASSWORD }}
        run: |
          test -n "$STRETCH_KEYSTORE_PASSWORD"
          test -n "$STRETCH_KEY_ALIAS"
          test -n "$STRETCH_KEY_PASSWORD"
          gradle -p android :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stretch-timer-fixed-signed-apk
          path: android/app/build/outputs/apk/debug/app-debug-v*.apk
          if-no-files-found: error
