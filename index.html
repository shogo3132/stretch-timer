<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f8fa">
<link rel="manifest" href="manifest.webmanifest">
<title>Stretch Timer</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1b1f24;background:#f7f8fa;--mint:#27ae8b;--dark:#11161e;--muted:#6e7680;--soft:#eaEEF2;--danger:#ae3742;--dangerbg:#fcecef}
*{box-sizing:border-box}body{margin:0;background:#f7f8fa}button,input,textarea{font:inherit}.app{max-width:760px;margin:auto;min-height:100dvh;background:#f7f8fa}.top{position:sticky;top:0;z-index:10;background:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px}.top.dark{background:var(--dark);color:#fff}.top h1{font-size:22px;margin:0;flex:1}.screen{display:none;padding:22px 20px 38px}.screen.active{display:block}.btn{border:0;border-radius:15px;min-height:48px;padding:10px 16px;background:var(--mint);color:#fff;cursor:pointer}.btn.sub{background:var(--soft);color:#1b1f24}.btn.danger{background:var(--dangerbg);color:var(--danger)}.btn.icon{min-width:46px;min-height:42px;padding:5px 10px;font-size:23px}.btn.small{min-height:38px;padding:5px 12px;font-size:12px}.row{display:flex;gap:12px;align-items:center}.row>*{flex:1}.stack{display:grid;gap:16px}.card{border:0;border-radius:20px;padding:18px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04)}.muted{color:var(--muted);font-size:14px}.field{display:grid;gap:7px;color:#48505a;font-size:14px}.field input,.field textarea{width:100%;border:0;border-radius:16px;padding:15px 16px;background:#fff;color:#1b1f24;font-size:17px;outline:1px solid #edf0f2}.field textarea{min-height:100px;resize:vertical}.headline-row{display:flex;align-items:center;gap:12px}.headline{font-size:28px;font-weight:800;margin:0;flex:1}.subhead{color:var(--muted);font-size:15px;margin:2px 0 4px}.secondary-row{display:flex;justify-content:flex-end;margin-top:-4px}.menu-card{display:grid;gap:12px}.menu-head{display:flex;align-items:flex-start;gap:12px}.menu-head>div{flex:1}.menu-title{font-size:21px;font-weight:800}.menu-desc{color:#5c646e;font-size:14px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.menu-actions{display:flex;gap:10px}.menu-actions button{flex:1}.items{display:grid;gap:12px}.item{display:grid;grid-template-columns:78px 1fr auto;gap:14px;align-items:center;padding:12px}.item.dragging,.menu-card.dragging{opacity:.55}.item.over,.menu-card.over{outline:2px solid var(--mint)}.thumb{width:78px;height:78px;border-radius:14px;object-fit:cover;background:#e1e4e8}.item-title{font-size:17px;font-weight:700}.duration{font-size:14px;color:var(--muted);margin-top:-8px}.photo-preview{width:100%;height:240px;object-fit:cover;border-radius:18px;background:#e1e4e8}.tip{font-size:13px;color:#78808a}.section-title{font-size:24px;font-weight:800;margin:12px 0 0}.empty{padding:42px 10px;text-align:center;color:#6e7680}.settings-status{font-size:15px;margin-top:2px}.timer-screen{background:var(--dark);min-height:calc(100dvh - 72px);color:#fff}.timer-wrap{display:grid;gap:16px;text-align:center}.timer-img{width:100%;height:220px;object-fit:cover;border-radius:20px;background:#232b36}.timer-name{font-size:28px;font-weight:800}.circle{width:290px;height:290px;margin:0 auto;position:relative;display:grid;place-items:center}.circle svg{position:absolute;inset:0;transform:rotate(-90deg)}.circle circle{fill:none;stroke-width:16;stroke-linecap:round}.circle .track{stroke:#373e4a}.circle .progress{stroke:#57dcbb;transition:stroke-dashoffset .15s linear}.circle-text{font-size:72px;font-weight:800;line-height:1}.circle-sub{font-size:15px;color:#acb5c3;margin-top:8px}.timer-desc{white-space:pre-wrap;color:#d4dae2;font-size:17px;padding:0 10px}.timer-count{color:#9aa4b3;font-size:15px}.timer-controls{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px}.timer-controls .btn{background:#1f2630}.timer-controls .main{background:#2f8f78}.prestart{padding:70px 12px;text-align:center}.prestart .num{font-size:92px;font-weight:800;margin:18px 0}.prestart .first{font-size:24px;font-weight:800;color:#57dcbb}@media(min-width:700px){.app{border-left:1px solid #eceff1;border-right:1px solid #eceff1}.timer-img{height:300px}}
</style>
</head>
<body>
<div class="app">
  <div id="topBar" class="top"><button id="backBtn" class="btn sub" style="display:none">←</button><h1 id="title">ストレッチ</h1><button id="topAction" class="btn sub icon" aria-label="設定">⚙</button></div>

  <main id="home" class="screen active"><div class="stack">
    <div><div class="headline-row"><div class="headline">マイメニュー</div><button id="addMenuHome" class="btn sub icon" aria-label="メニューを追加">＋</button></div><div class="subhead">メニューを選んで開始します。長押しまたはドラッグで並び替えできます。</div></div>
    <div id="homeSyncRow" class="secondary-row"></div><div id="menuList" class="stack"></div>
  </div></main>

  <main id="settings" class="screen"><div class="stack">
    <div class="headline">設定</div><div class="card stack"><div><div class="section-title" style="margin:0">Dropbox 同期</div><div id="dropboxStatus" class="settings-status"></div></div><div id="dropboxDesc" class="muted"></div><div id="lastSync" class="muted"></div><div id="settingsSyncActions" class="stack"></div></div>
    <div class="tip">同期は普段、自動で行われます。手動同期はPCなど別端末で編集した直後に最新版を確認したいときに使います。</div>
  </div></main>

  <main id="menuEdit" class="screen"><div class="stack">
    <div class="headline">メニュー</div><label class="field">メニュー名<input id="menuName"></label><label class="field">説明・メモ<textarea id="menuDesc" placeholder="このメニューの目的や内容など"></textarea></label><label class="field">項目間の休憩時間（秒）<input id="restSeconds" type="number" min="0" max="600" inputmode="numeric"></label><div id="menuDuration" class="duration"></div><div class="row"><button id="addItemBtn" class="btn sub">＋ 項目追加</button><button id="startMenuBtn" class="btn">▶ 開始</button></div><div><div class="section-title">項目</div><div class="tip">長押しまたはドラッグで並び替え</div></div><div id="itemList" class="items"></div><button id="duplicateMenuBtn" class="btn sub">このメニューを複製</button><button id="deleteMenuBtn" class="btn danger">このメニューを削除</button>
  </div></main>

  <main id="itemEdit" class="screen"><div class="stack">
    <div class="headline">項目</div><label class="field">項目名<input id="itemName"></label><label class="field">運動時間（秒）<input id="itemSeconds" type="number" min="1" max="3600" inputmode="numeric"></label><label class="field">説明・メモ<textarea id="itemDesc" placeholder="フォームや注意点など"></textarea></label><div class="field"><span>写真</span><img id="photoPreview" class="photo-preview" alt="写真プレビュー"><input id="photoInput" type="file" accept="image/*" capture="environment"></div><div class="tip">並び順はメニュー画面で項目を長押しまたはドラッグして変更できます。</div><div class="row"><button id="duplicateItemBtn" class="btn sub">複製</button><button id="deleteItemBtn" class="btn danger">削除</button></div>
  </div></main>

  <main id="timer" class="screen timer-screen"><div id="timerContent" class="timer-wrap"></div></main>
</div>
<script>
const STORAGE='stretchTimer.v2',OLD_STORAGE='stretchTimer.v1',SYNC_META='stretchTimer.syncMeta',DROPBOX_APP_KEY='yf8bmab58g823cb',REDIRECT_URI='https://shogo3132.github.io/stretch-timer/';
let state=load(),currentMenuId=null,currentItemId=null,timerState=null,wakeLock=null,syncTimer=null,syncing=false,currentScreen='home';
const $=id=>document.getElementById(id);function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random().toString(16).slice(2)}
function normalize(s){s=s||{};s.schemaVersion=2;s.updatedAt=Number(s.updatedAt||0);s.menus=Array.isArray(s.menus)?s.menus:[];s.menus.forEach(m=>{m.id=m.id||uid();m.name=m.name||'メニュー';m.desc=m.desc||'';m.rest=Number.isFinite(+m.rest)?+m.rest:15;m.items=Array.isArray(m.items)?m.items:[];m.items.forEach(x=>{x.id=x.id||uid();x.name=x.name||'項目';x.seconds=Math.max(1,+x.seconds||30);x.desc=x.desc||'';x.photo=x.photo||x.photoData||''})});return s}
function load(){try{let x=localStorage.getItem(STORAGE);if(x)return normalize(JSON.parse(x));let old=localStorage.getItem(OLD_STORAGE);if(old){const s=normalize(JSON.parse(old));s.updatedAt=Date.now();localStorage.setItem(STORAGE,JSON.stringify(s));return s}}catch{}return {schemaVersion:2,updatedAt:0,menus:[]}}
function save(mark=true){if(mark)state.updatedAt=Date.now();localStorage.setItem(STORAGE,JSON.stringify(state));if(mark)queueSync()}
function syncMeta(){try{return JSON.parse(localStorage.getItem(SYNC_META))||{}}catch{return {}}}function setSyncMeta(p){localStorage.setItem(SYNC_META,JSON.stringify({...syncMeta(),...p}))}
function show(id,title,action=null){currentScreen=id;document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');$('title').textContent=title;$('backBtn').style.display=id==='home'?'none':'inline-block';$('topBar').classList.toggle('dark',id==='timer');$('topAction').style.display=action?'inline-block':'none';if(action){$('topAction').textContent=action.label;$('topAction').className='btn sub icon';$('topAction').onclick=action.fn}}
function totalSeconds(m){return m.items.reduce((a,x)=>a+Math.max(1,+x.seconds||1),0)+Math.max(0,+m.rest||0)*Math.max(0,m.items.length-1)}
function durationText(m){const s=totalSeconds(m),min=Math.floor(s/60),sec=s%60;return min?`${min}分${sec?sec+'秒':''}`:`${sec}秒`}
function menu(){return state.menus.find(x=>x.id===currentMenuId)}function item(){return menu()?.items.find(x=>x.id===currentItemId)}
function createMenu(){const m={id:uid(),name:`メニュー${state.menus.length+1}`,desc:'',rest:15,items:[]};state.menus.push(m);save();openMenu(m.id)}
$('addMenuHome').onclick=createMenu;

function renderHome(){show('home','ストレッチ');const sr=$('homeSyncRow');sr.innerHTML='';if(hasDropboxAuth()){const b=document.createElement('button');b.className='btn sub small';b.textContent='↻ 同期';b.onclick=()=>syncNow(true);sr.appendChild(b)}const box=$('menuList');box.innerHTML='';if(!state.menus.length){box.innerHTML='<div class="empty">まだメニューがありません。<br>「マイメニュー」横の「＋」から作成してください。</div>';return}state.menus.forEach(m=>{const el=document.createElement('div');el.className='card menu-card';el.dataset.id=m.id;el.innerHTML=`<div class="menu-head"><div><div class="menu-title"></div><div class="menu-desc"></div><div class="muted meta"></div></div><button class="btn sub edit" style="flex:0 0 auto">設定</button></div><div class="menu-actions"><button class="btn start">▶ このメニューを開始</button></div>`;el.querySelector('.menu-title').textContent=m.name;const d=el.querySelector('.menu-desc');d.textContent=m.desc||'';d.style.display=m.desc?'block':'none';el.querySelector('.meta').textContent=`${m.items.length}項目 ・ 合計 ${durationText(m)}`;el.querySelector('.start').onclick=()=>startTimer(m.id);el.querySelector('.edit').onclick=()=>openMenu(m.id);box.appendChild(el)})}

function renderSettings(){show('settings','設定');const connected=hasDropboxAuth();$('dropboxStatus').textContent=connected?'接続済み':'未接続';$('dropboxStatus').style.color=connected?'#27ae8b':'#6e7680';$('dropboxDesc').textContent=connected?'ルーティンや写真・動画は変更後に自動同期されます。PCとAndroidで同じデータを利用できます。':'Dropboxに接続すると、PCとAndroidで同じルーティン・種目・写真・動画を利用できます。';const last=+syncMeta().lastSync||0;$('lastSync').textContent=connected?`最終同期：${last?new Date(last).toLocaleString('ja-JP'):'まだありません'}`:'';const a=$('settingsSyncActions');a.innerHTML='';if(connected){const now=document.createElement('button');now.className='btn';now.textContent='↻ 今すぐ同期';now.onclick=()=>syncNow(true);const off=document.createElement('button');off.className='btn danger';off.textContent='Dropbox連携を解除';off.onclick=()=>{if(confirm('Dropboxとの接続を解除しますか？\n端末内のデータは残ります。')){clearDropboxAuth();renderSettings()}};a.append(now,off)}else{const c=document.createElement('button');c.className='btn';c.textContent='Dropboxと接続';c.onclick=beginDropboxAuth;a.appendChild(c)}}

function openMenu(id){currentMenuId=id;currentItemId=null;const m=menu();if(!m)return renderHome();show('menuEdit','メニュー設定');$('menuName').value=m.name;$('menuDesc').value=m.desc||'';$('restSeconds').value=m.rest;updateDuration();renderItems()}
function updateDuration(){const m=menu();if(m)$('menuDuration').textContent='合計時間  '+durationText(m)}
$('menuName').oninput=e=>{menu().name=e.target.value||'名称未設定';save()};$('menuDesc').oninput=e=>{menu().desc=e.target.value;save()};$('restSeconds').oninput=e=>{menu().rest=Math.max(0,+e.target.value||0);save();updateDuration()};
$('addItemBtn').onclick=()=>{const m=menu(),x={id:uid(),name:'新しい項目',seconds:30,desc:'',photo:''};m.items.push(x);save();openItem(x.id)};$('startMenuBtn').onclick=()=>startTimer(currentMenuId);
$('duplicateMenuBtn').onclick=()=>{const m=menu(),c=JSON.parse(JSON.stringify(m));c.id=uid();c.name=m.name+' コピー';c.items.forEach(x=>x.id=uid());state.menus.splice(state.menus.indexOf(m)+1,0,c);save();openMenu(c.id)};$('deleteMenuBtn').onclick=()=>{if(confirm('このメニューを削除しますか？')){state.menus=state.menus.filter(x=>x.id!==currentMenuId);save();renderHome()}};
function renderItems(){const m=menu(),box=$('itemList');box.innerHTML='';if(!m.items.length){box.innerHTML='<div class="empty">項目がありません。</div>';return}m.items.forEach((x,i)=>{const el=document.createElement('div');el.className='card item';el.dataset.id=x.id;el.innerHTML=`<img class="thumb"><div><div class="item-title"></div><div class="muted"></div></div><button class="btn sub">編集</button>`;el.querySelector('.thumb').src=x.photo||svgPlaceholder();el.querySelector('.item-title').textContent=`${i+1}. ${x.name}`;el.querySelector('.muted').textContent=`${x.seconds}秒`;el.querySelector('button').onclick=()=>openItem(x.id);box.appendChild(el)})}
function openItem(id){currentItemId=id;const x=item();show('itemEdit','項目設定');$('itemName').value=x.name;$('itemSeconds').value=x.seconds;$('itemDesc').value=x.desc;$('photoPreview').src=x.photo||svgPlaceholder()}
$('itemName').oninput=e=>{item().name=e.target.value||'名称未設定';save()};$('itemSeconds').oninput=e=>{item().seconds=Math.max(1,+e.target.value||1);save()};$('itemDesc').oninput=e=>{item().desc=e.target.value;save()};$('photoInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{item().photo=r.result;$('photoPreview').src=r.result;save()};r.readAsDataURL(f)};$('deleteItemBtn').onclick=()=>{if(confirm('この項目を削除しますか？')){const m=menu();m.items=m.items.filter(x=>x.id!==currentItemId);save();openMenu(m.id)}};$('duplicateItemBtn').onclick=()=>{const m=menu(),x=item(),copy={...x,id:uid(),name:x.name+' コピー'},idx=m.items.findIndex(y=>y.id===x.id);m.items.splice(idx+1,0,copy);save();openItem(copy.id)};

$('backBtn').onclick=goBack;function goBack(){if(currentScreen==='timer'){stopTimer();openMenu(currentMenuId)}else if(currentScreen==='itemEdit')openMenu(currentMenuId);else if(currentScreen==='menuEdit'||currentScreen==='settings')renderHome();else renderHome()}
window.addEventListener('popstate',()=>goBack());
function beep(freq=880,dur=.12){try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=freq;o.connect(g);g.connect(c.destination);g.gain.value=.05;o.start();setTimeout(()=>{o.stop();c.close()},dur*1000)}catch{}}
async function keepAwake(){try{if('wakeLock'in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch{}}function releaseAwake(){try{wakeLock?.release()}catch{}wakeLock=null}
function startTimer(menuId){const m=state.menus.find(x=>x.id===menuId);if(!m||!m.items.length){alert('このメニューには項目がありません');return}currentMenuId=menuId;timerState={index:0,phase:'pre',remaining:3,paused:false,interval:null,total:3};show('timer',m.name);keepAwake();renderTimer();runPreStart()}
function runPreStart(){clearInterval(timerState.interval);beep(680);timerState.interval=setInterval(()=>{timerState.remaining--;if(timerState.remaining>0){beep(680);renderTimer()}else{clearInterval(timerState.interval);const m=menu();timerState.phase='item';timerState.remaining=m.items[0].seconds;timerState.total=m.items[0].seconds;renderTimer();runTick()}},1000)}
function runTick(){clearInterval(timerState.interval);timerState.interval=setInterval(()=>{if(timerState.paused)return;timerState.remaining--;if(timerState.remaining<=3&&timerState.remaining>0)beep(700);if(timerState.remaining<=0){beep(1000,.2);advance()}renderTimer()},1000)}
function advance(){const m=menu();if(timerState.phase==='item'&&m.rest>0&&timerState.index<m.items.length-1){timerState.phase='rest';timerState.remaining=m.rest;timerState.total=m.rest;return}timerState.index++;if(timerState.index>=m.items.length){finishTimer();return}timerState.phase='item';timerState.remaining=m.items[timerState.index].seconds;timerState.total=m.items[timerState.index].seconds}
function skip(delta){const m=menu();timerState.index=Math.max(0,Math.min(m.items.length-1,timerState.index+delta));timerState.phase='item';timerState.remaining=m.items[timerState.index].seconds;timerState.total=m.items[timerState.index].seconds;renderTimer()}
function finishTimer(){clearInterval(timerState.interval);timerState=null;releaseAwake();$('timerContent').innerHTML='<div class="prestart"><div class="num" style="color:#57dcbb">✓</div><div class="timer-name">おつかれさまでした</div><button class="btn sub" id="doneBtn">メニューへ戻る</button></div>';$('doneBtn').onclick=()=>openMenu(currentMenuId)}function stopTimer(){if(timerState)clearInterval(timerState.interval);timerState=null;releaseAwake()}
function circleHtml(remain,total,label){const r=120,c=2*Math.PI*r,f=Math.max(0,Math.min(1,1-remain/Math.max(1,total)));return `<div class="circle"><svg viewBox="0 0 290 290"><circle class="track" cx="145" cy="145" r="${r}"></circle><circle class="progress" cx="145" cy="145" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-f)}"></circle></svg><div><div class="circle-text">${remain}</div><div class="circle-sub">${label}</div></div></div>`}
function renderTimer(){if(!timerState)return;const m=menu(),box=$('timerContent');if(timerState.phase==='pre'){box.innerHTML=`<div class="prestart"><div class="muted">開始まで</div><div class="num">${timerState.remaining}</div><div class="first">${escapeHtml(m.items[0].name)}</div></div>`;return}if(timerState.phase==='rest'){box.innerHTML=`<div class="timer-name">休憩</div>${circleHtml(timerState.remaining,timerState.total,'休憩')}<div class="timer-count">${timerState.index+1} / ${m.items.length}</div><div class="timer-desc">次：${escapeHtml(m.items[timerState.index+1]?.name||'完了')}</div><div class="timer-controls"><button class="btn prev">← 前へ</button><button class="btn main pause">${timerState.paused?'▶ 再開':'Ⅱ 一時停止'}</button><button class="btn next">次へ →</button></div>`}else{const x=m.items[timerState.index];box.innerHTML=`<div class="timer-name">${escapeHtml(x.name)}</div>${x.photo?`<img class="timer-img" src="${x.photo}">`:''}${circleHtml(timerState.remaining,timerState.total,'秒')}<div class="timer-count">${timerState.index+1} / ${m.items.length}</div>${x.desc?`<div class="timer-desc">${escapeHtml(x.desc)}</div>`:''}<div class="timer-controls"><button class="btn prev">← 前へ</button><button class="btn main pause">${timerState.paused?'▶ 再開':'Ⅱ 一時停止'}</button><button class="btn next">次へ →</button></div>`}box.querySelector('.pause').onclick=()=>{timerState.paused=!timerState.paused;renderTimer()};box.querySelector('.prev').onclick=()=>skip(-1);box.querySelector('.next').onclick=()=>skip(1)}
function escapeHtml(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function svgPlaceholder(){return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400"><rect width="100%" height="100%" rx="24" fill="#e1e4e8"/></svg>`)}

function authData(){try{return JSON.parse(localStorage.getItem('stretchTimer.dropboxAuth'))||{}}catch{return {}}}function hasDropboxAuth(){const a=authData();return !!(a.access_token||a.refresh_token)}function clearDropboxAuth(){localStorage.removeItem('stretchTimer.dropboxAuth');localStorage.removeItem(SYNC_META)}function b64url(bytes){return btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}async function sha256(s){return new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))}
async function beginDropboxAuth(){const verifier=b64url(crypto.getRandomValues(new Uint8Array(48))),challenge=b64url(await sha256(verifier)),oauthState=uid();sessionStorage.setItem('dbx_verifier',verifier);sessionStorage.setItem('dbx_state',oauthState);const u=new URL('https://www.dropbox.com/oauth2/authorize');u.search=new URLSearchParams({client_id:DROPBOX_APP_KEY,response_type:'code',redirect_uri:REDIRECT_URI,code_challenge:challenge,code_challenge_method:'S256',token_access_type:'offline',scope:'files.metadata.read files.content.read files.content.write',state:oauthState});location.href=u.toString()}
async function finishDropboxAuth(){const q=new URLSearchParams(location.search),code=q.get('code');if(!code)return false;const expected=sessionStorage.getItem('dbx_state');if(q.get('state')!==expected)throw new Error('OAuth state mismatch');const verifier=sessionStorage.getItem('dbx_verifier');const body=new URLSearchParams({code,grant_type:'authorization_code',client_id:DROPBOX_APP_KEY,redirect_uri:REDIRECT_URI,code_verifier:verifier});const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});if(!r.ok)throw new Error('token exchange failed');const t=await r.json();t.expires_at=Date.now()+(t.expires_in||14400)*1000;localStorage.setItem('stretchTimer.dropboxAuth',JSON.stringify(t));sessionStorage.removeItem('dbx_verifier');sessionStorage.removeItem('dbx_state');history.replaceState({},'',REDIRECT_URI);return true}
async function accessToken(){let a=authData();if(a.access_token&&(!a.expires_at||Date.now()<a.expires_at-60000))return a.access_token;if(!a.refresh_token)throw new Error('Dropbox reconnect required');const body=new URLSearchParams({grant_type:'refresh_token',refresh_token:a.refresh_token,client_id:DROPBOX_APP_KEY});const r=await fetch('https://api.dropboxapi.com/oauth2/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});if(!r.ok)throw new Error('refresh failed');const t=await r.json();a={...a,...t,refresh_token:a.refresh_token,expires_at:Date.now()+(t.expires_in||14400)*1000};localStorage.setItem('stretchTimer.dropboxAuth',JSON.stringify(a));return a.access_token}
function syncPayload(){return JSON.stringify({schemaVersion:2,updatedAt:state.updatedAt||Date.now(),menus:state.menus.map(m=>({...m,items:m.items.map(x=>({id:x.id,name:x.name,seconds:x.seconds,desc:x.desc,photoData:x.photo||''}))}))})}
async function dropboxDownload(){const token=await accessToken(),r=await fetch('https://content.dropboxapi.com/2/files/download',{method:'POST',headers:{Authorization:`Bearer ${token}`,'Dropbox-API-Arg':JSON.stringify({path:'/data.json'})}});if(r.status===409)return null;if(!r.ok)throw new Error('download failed');return await r.text()}
async function dropboxUpload(json){const token=await accessToken(),r=await fetch('https://content.dropboxapi.com/2/files/upload',{method:'POST',headers:{Authorization:`Bearer ${token}`,'Dropbox-API-Arg':JSON.stringify({path:'/data.json',mode:'overwrite',autorename:false,mute:true}),'Content-Type':'application/octet-stream'},body:json});if(!r.ok)throw new Error('upload failed')}
function applyRemote(raw,remoteTime){const r=JSON.parse(raw);state=normalize({schemaVersion:2,updatedAt:remoteTime,menus:(r.menus||[]).map(m=>({...m,items:(m.items||[]).map(x=>({...x,photo:x.photoData||x.photo||''}))}))});save(false);setSyncMeta({lastSync:remoteTime});renderHome()}
function queueSync(){if(!hasDropboxAuth())return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(false),3500)}
async function syncNow(userInitiated=false){if(syncing)return;if(!hasDropboxAuth()){await beginDropboxAuth();return}syncing=true;try{const local=syncPayload(),localTime=state.updatedAt||0,remoteRaw=await dropboxDownload(),last=+syncMeta().lastSync||0;if(!remoteRaw){await dropboxUpload(local);setSyncMeta({lastSync:localTime});if(userInitiated)alert('Dropboxへ初回同期しました');return}const remote=JSON.parse(remoteRaw),remoteTime=+remote.updatedAt||0,localChanged=localTime>last,remoteChanged=remoteTime>last;if(last===0&&(remote.menus||[]).length&&state.menus.length){const useLocal=confirm('この端末とDropboxの両方にデータがあります。\n\nOK：この端末の内容をDropboxへ保存\nキャンセル：Dropbox版をこの端末に反映');if(useLocal){await dropboxUpload(local);setSyncMeta({lastSync:localTime})}else applyRemote(remoteRaw,remoteTime);return}if(remoteChanged&&localChanged&&remoteTime!==localTime){const useLocal=confirm('この端末とDropboxの両方に新しい変更があります。\n\nOK：この端末を使う\nキャンセル：Dropbox版を使う');if(useLocal){await dropboxUpload(local);setSyncMeta({lastSync:localTime})}else applyRemote(remoteRaw,remoteTime);return}if(remoteChanged&&!localChanged){applyRemote(remoteRaw,remoteTime);return}if(localChanged){await dropboxUpload(local);setSyncMeta({lastSync:localTime})}if(userInitiated)alert('同期は最新です')}catch(e){console.error(e);if(userInitiated)alert('Dropbox同期に失敗しました。設定から再接続してください。')}finally{syncing=false;if(currentScreen==='home')renderHome();else if(currentScreen==='settings')renderSettings()}}

(async()=>{try{const connected=await finishDropboxAuth();renderHome();if(connected)await syncNow(true);else if(hasDropboxAuth())setTimeout(()=>syncNow(false),700)}catch(e){console.error(e);alert('Dropboxへの接続に失敗しました。');renderHome()}})();
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
</script>
</body></html>
