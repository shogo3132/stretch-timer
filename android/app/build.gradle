plugins {
    id 'com.android.application'
}

android {
    namespace 'com.shogo.stretchtimer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.shogo.stretchtimer'
        minSdk 26
        targetSdk 35
        versionCode 19
        versionName '0.12.7'
    }

    signingConfigs {
        fixed {
            storeFile file(System.getenv('STRETCH_KEYSTORE_PATH') ?: 'stretch-timer.jks')
            storePassword System.getenv('STRETCH_KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('STRETCH_KEY_ALIAS') ?: ''
            keyPassword System.getenv('STRETCH_KEY_PASSWORD') ?: ''
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "app-${variant.buildType.name}-v${variant.versionName}.apk"
        }
    }
}

dependencies {
    implementation 'com.dropbox.core:dropbox-android-sdk:7.0.0'
}
